<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Color Festival</title>

  <link rel="stylesheet" href="style.css">

  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

  <!-- HERO -->

  <section class="hero">

    </video>

    <!-- OVERLAY -->

    <div class="overlay"></div>

    <!-- HEADER -->

    <header>

      <nav>

        <ul>

          <li><a href="#">Tickets</a></li>
        </ul>

      </nav>

    </header>

    <!-- HERO CONTENT -->

    <div class="hero-content">

      <img src="logo.png" alt="Color Festival" class="logo">

      <h1>
        LA FIESTA COLOR<br>
        MÁS GRANDE<br>
        DE ARGENTINA
      </h1>

      <p>
        Verano • Sunset • Música • Color • Gualeguaychú
      </p>

      <a href="#" class="btn">

      <div class="instagram">

</html>
